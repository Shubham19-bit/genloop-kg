# 35 companies in 4 sectors, so cross-company questions are meaningful.
# CIKs are looked up automatically from SEC's company_tickers.json.
# "sector" is OUR grouping (source = this config file), not a fact from the filing.
# One comparable "year" for everyone: the latest 10-K whose period ENDED inside this window.
# Gives Nike/Oracle May-2025, Apple Sep-2025, Microsoft Jun-2025, Walmart/NVIDIA Jan-2026,
# Home Depot Feb-2026, Dec-year firms Dec-2025,
# i.e. every filing covers mostly calendar 2025. period_end is stored on every fact.
target_fiscal_year: 2025   # label used in fact keys, e.g. JPM|TotalAssets|FY2025
period_start: "2025-05-01"
period_end: "2026-02-28"

companies:
  # --- Technology ---
  - {ticker: AAPL,  name: Apple Inc.,                 sector: Technology, aliases: [Apple]}
  - {ticker: MSFT,  name: Microsoft Corporation,      sector: Technology, aliases: [Microsoft]}
  - {ticker: GOOGL, name: Alphabet Inc.,              sector: Technology, aliases: [Alphabet, Google]}
  - {ticker: AMZN,  name: Amazon.com Inc.,            sector: Technology, aliases: [Amazon]}
  - {ticker: META,  name: Meta Platforms Inc.,        sector: Technology, aliases: [Meta, Facebook]}
  - {ticker: NVDA,  name: NVIDIA Corporation,         sector: Technology, aliases: [NVIDIA, Nvidia]}
  - {ticker: ORCL,  name: Oracle Corporation,         sector: Technology, aliases: [Oracle]}
  - {ticker: ADBE,  name: Adobe Inc.,                 sector: Technology, aliases: [Adobe]}
  - {ticker: CRM,   name: Salesforce Inc.,            sector: Technology, aliases: [Salesforce]}
  # --- Banks & Payments ---
  - {ticker: JPM,   name: JPMorgan Chase & Co.,       sector: Financials, aliases: [JPMorgan, JP Morgan, Chase]}
  - {ticker: BAC,   name: Bank of America Corporation, sector: Financials, aliases: [Bank of America, BofA]}
  - {ticker: WFC,   name: Wells Fargo & Company,      sector: Financials, aliases: [Wells Fargo], exhibit_13: true}   # statements are in Exhibit 13
  - {ticker: C,     name: Citigroup Inc.,             sector: Financials, aliases: [Citigroup, Citi]}
  - {ticker: GS,    name: The Goldman Sachs Group Inc., sector: Financials, aliases: [Goldman Sachs, Goldman]}
  - {ticker: MS,    name: Morgan Stanley,             sector: Financials, aliases: [Morgan Stanley]}
  - {ticker: V,     name: Visa Inc.,                  sector: Financials, aliases: [Visa]}
  - {ticker: MA,    name: Mastercard Incorporated,    sector: Financials, aliases: [Mastercard]}
  - {ticker: AXP,   name: American Express Company,   sector: Financials, aliases: [American Express, Amex]}
  # --- Retail & Consumer ---
  - {ticker: WMT,   name: Walmart Inc.,               sector: Consumer, aliases: [Walmart]}
  - {ticker: COST,  name: Costco Wholesale Corporation, sector: Consumer, aliases: [Costco]}
  - {ticker: TGT,   name: Target Corporation,         sector: Consumer, aliases: [Target]}
  - {ticker: HD,    name: The Home Depot Inc.,        sector: Consumer, aliases: [Home Depot]}
  - {ticker: LOW,   name: Lowe's Companies Inc.,      sector: Consumer, aliases: [Lowe's, Lowes]}
  - {ticker: NKE,   name: NIKE Inc.,                  sector: Consumer, aliases: [Nike]}
  - {ticker: MCD,   name: McDonald's Corporation,     sector: Consumer, aliases: [McDonald's, McDonalds]}
  - {ticker: KO,    name: The Coca-Cola Company,      sector: Consumer, aliases: [Coca-Cola, Coke]}
  - {ticker: PEP,   name: PepsiCo Inc.,               sector: Consumer, aliases: [PepsiCo, Pepsi]}
  # --- Healthcare / Pharma ---
  - {ticker: JNJ,   name: Johnson & Johnson,          sector: Healthcare, aliases: [J&J, Johnson and Johnson]}
  - {ticker: PFE,   name: Pfizer Inc.,                sector: Healthcare, aliases: [Pfizer]}
  - {ticker: MRK,   name: Merck & Co. Inc.,           sector: Healthcare, aliases: [Merck]}
  - {ticker: ABBV,  name: AbbVie Inc.,                sector: Healthcare, aliases: [AbbVie]}
  - {ticker: LLY,   name: Eli Lilly and Company,      sector: Healthcare, aliases: [Eli Lilly, Lilly]}
  - {ticker: UNH,   name: UnitedHealth Group Incorporated, sector: Healthcare, aliases: [UnitedHealth]}
  - {ticker: TMO,   name: Thermo Fisher Scientific Inc., sector: Healthcare, aliases: [Thermo Fisher]}
  - {ticker: AMGN,  name: Amgen Inc.,                 sector: Healthcare, aliases: [Amgen]}
